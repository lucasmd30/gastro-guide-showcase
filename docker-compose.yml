services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gastroguide
      POSTGRES_USER: gastroguide
      POSTGRES_PASSWORD: gastroguide
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastroguide"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gastroguide
      DB_USER: gastroguide
      DB_PASSWORD: gastroguide
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-troque-em-producao-0123456789abcdef}
    ports:
      - "8080:8080"

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
